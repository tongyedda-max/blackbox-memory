    <script type="module">
const STORAGE_KEY = "blackbox-memory-ledger-offline-v1";
const BACKUP_VERSION = 1;

const CATEGORY_META = {
  work: { label: "工作與職涯", color: "#9e3d34", words: ["工作", "上班", "開會", "會議", "公司", "專案", "報告", "客戶", "email", "求職", "履歷", "work", "office", "meeting", "project", "career"] },
  learning: { label: "學習與技能", color: "#c47b2c", words: ["學習", "讀書", "閱讀", "課程", "功課", "背單字", "研究", "練習", "study", "learn", "read", "course", "practice"] },
  health: { label: "身心健康", color: "#49815a", words: ["運動", "跑步", "健身", "喝水", "睡覺", "散步", "瑜伽", "冥想", "看醫生", "exercise", "run", "walk", "gym", "health", "meditate"] },
  selfcare: { label: "自我照顧", color: "#a75f72", words: ["休息", "洗澡", "護膚", "吃飯", "煮飯", "早餐", "午餐", "晚餐", "用餐", "進食", "食飯", "情緒", "日記", "洗手間", "如廁", "廁所", "洗手", "rest", "shower", "meal", "journal", "toilet", "bathroom"] },
  caregiving: { label: "照顧與責任", color: "#68834b", words: ["照顧", "家人", "孩子", "寵物", "長輩", "陪伴", "送醫", "care", "family", "child", "pet"] },
  organising: { label: "家務與整理", color: "#80694c", words: ["整理", "清潔", "打掃", "洗衣", "收拾", "收納", "倒垃圾", "clean", "organize", "tidy", "laundry"] },
  finance: { label: "財務與行政", color: "#5f6d90", words: ["理財", "記帳", "繳費", "帳單", "報稅", "銀行", "預算", "保險", "finance", "budget", "bank", "bill"] },
  social: { label: "關係與社交", color: "#be6a50", words: ["朋友", "家人", "聊天", "約會", "聯絡", "感謝", "社交", "friend", "social", "call", "message"] },
  hobby: { label: "創作與興趣", color: "#7b5ca9", words: ["興趣", "畫畫", "繪畫", "攝影", "音樂", "寫作", "手作", "設計", "編程", "draw", "music", "photo", "write", "hobby", "create"] },
  entertainment: { label: "娛樂與休閒", color: "#3b7898", words: ["娛樂", "電影", "追劇", "遊戲", "看劇", "動畫", "漫畫", "movie", "game", "show", "anime"] },
  exploration: { label: "出行與探索", color: "#348391", words: ["通勤", "出門", "旅行", "行山", "遠足", "參觀", "探索", "commute", "travel", "hike", "explore"] },
  growth: { label: "習慣與成長", color: "#a8892c", words: ["習慣", "目標", "反思", "規劃", "早起", "自律", "成長", "goal", "habit", "reflect", "plan"] },
  other: { label: "其他", color: "#747474", words: [] },
};

const rarityBands = [
  [5000, "N"], [8000, "R"], [9500, "SR"], [9900, "SSR"], [10000, "UR"],
];

function makeId(prefix, uuid = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`) {
  return `${prefix}_${uuid.replace(/[^a-zA-Z0-9]/g, "").slice(0, 20)}`;
}

function newLedger(now = new Date().toISOString()) {
  return {
    backupVersion: BACKUP_VERSION,
    localLedgerId: makeId("ledger"),
    createdAt: now,
    updatedAt: now,
    settings: { echoRate: 20, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Hong_Kong", profile: { displayName: "", priorities: [], encouragementTone: "溫暖真誠", customDirections: "", onboardingDone: false } },
    reports: [], events: [], cards: [], inventory: [], fusions: [], activities: [],
  };
}

function safeParseLedger(raw) {
  if (!raw) return newLedger();
  try {
    const parsed = JSON.parse(raw);
    const ledger = parsed?.ledger ?? parsed;
    if (ledger?.backupVersion !== BACKUP_VERSION || !Array.isArray(ledger.reports) || !Array.isArray(ledger.events) || !Array.isArray(ledger.cards) || !Array.isArray(ledger.activities)) return newLedger();
    return ledger;
  } catch { return newLedger(); }
}

function rarityFromRoll(roll) {
  if (!Number.isInteger(roll) || roll < 1 || roll > 10000) throw new Error("RARITY_ROLL_OUT_OF_RANGE");
  return rarityBands.find(([limit]) => roll <= limit)[1];
}

function modeFromRoll(roll, echoRate = 20) {
  if (!Number.isInteger(roll) || roll < 1 || roll > 100) throw new Error("MODE_ROLL_OUT_OF_RANGE");
  if (!Number.isInteger(echoRate) || echoRate < 0 || echoRate > 100) throw new Error("ECHO_RATE_OUT_OF_RANGE");
  return roll <= 100 - echoRate ? "explore" : "echo";
}

function rollSecurely(max) {
  const array = new Uint32Array(1);
  globalThis.crypto.getRandomValues(array);
  return (array[0] % max) + 1;
}

function normaliseName(value) {
  return value.normalize("NFKC").trim().toLowerCase().replace(/[\s\p{P}]/gu, "");
}

function classifyActivity({ text = "", tags = [], category = null }) {
  if (category && CATEGORY_META[category]) return category;
  const value = `${text} ${tags.join(" ")}`.toLowerCase();
  return Object.entries(CATEGORY_META).find(([, meta]) => meta.words.some(word => value.includes(word.toLowerCase())))?.[0] ?? "other";
}

function stableKey({ wikidataQid, canonicalName }) {
  const qid = wikidataQid?.trim().toUpperCase();
  if (/^Q\d+$/.test(qid ?? "")) return `wd:${qid}`;
  return `local:${normaliseName(canonicalName)}`;
}

function extractNaturalLanguageCard(raw) {
  const text = raw.trim();
  const registration = extractRegistrationMetadata(text);
  const title = text.match(/(?:恭喜獲得|獲得|抽到|得到)\s*[：:]?\s*[【\[]\s*([^】\]\n]+?)\s*[】\]]/i)?.[1]?.trim()
    ?? text.match(/(?:恭喜獲得|獲得|抽到|得到)\s*[：:]?\s*([^【\]（）()\n]+?)\s*(?:[（(]\s*)?稀有度\s*[：:]/i)?.[1]?.trim()
    ?? registration.canonicalName;
  const rarity = text.match(/稀有度\s*[：:]\s*(SSR|UR|SR|R|N)\b/i)?.[1]?.toUpperCase() ?? registration.rarity;
  const introduction = text.match(/(?:✨\s*)?(?:介紹|說明)\s*[：:]\s*([\s\S]*?)(?=\n\s*(?:權威來源|🎬|\[場記板|當前已解鎖|合成規則|<CARD-REGISTRATION>)|$)/i)?.[1]?.trim() ?? null;
  return { title, rarity, introduction: introduction ?? registration.factSummary };
}

/** 從可選技術區塊取得輔助資料；缺少或重複區塊不會影響自然語言主流程。 */
function extractRegistrationMetadata(raw) {
  const block = String(raw ?? "").match(/<CARD-REGISTRATION>\s*([\s\S]*?)\s*<\/CARD-REGISTRATION>/i)?.[1] ?? "";
  const read = (...names) => names.map(name => block.match(new RegExp(`^\\s*${name}\\s*:\\s*(.+?)\\s*$`, "im"))?.[1]?.trim()).find(Boolean) ?? null;
  const entityKey = read("entitykey", "entity_key");
  const wikidataQid = entityKey?.match(/(?:wd:)?(Q\d+)\b/i)?.[1]?.toUpperCase() ?? null;
  const rarity = read("rarity")?.match(/^(SSR|UR|SR|R|N)$/i)?.[1]?.toUpperCase() ?? null;
  return {
    canonicalName: read("canonicalname", "canonical_name"),
    wikidataQid,
    rarity,
    sourceUrl: read("sourceurl", "source_url"),
    sourceTitle: read("sourcetitle", "source_title"),
    factSummary: read("factsummary", "fact_summary"),
  };
}

function inferActivityFromAiResult(raw) {
  const text = raw.trim();
  if (/(?:洗手間|如廁|廁所|生理需求|上洗手間|身體的需求)/i.test(text)) return { text: "我照顧了身體的生理需要", tags: ["如廁", "自我照顧"], category: "selfcare", confidence: "inferred" };
  if (/(?:用餐|吃飯|進食|早餐|午餐|晚餐|食飯|meal)/i.test(text)) return { text: "我完成了用餐，好好照顧自己", tags: ["用餐", "自我照顧"], category: "selfcare", confidence: "inferred" };
  if (/(?:下班|回家的路|踏上歸途|回家路途)/i.test(text)) return { text: "我完成工作並踏上回家路", tags: ["工作", "下班", "回家"], category: "work", confidence: "inferred" };
  if (/(?:上班|工作|職責|公司|專案|會議)/i.test(text)) return { text: "我完成了上班／工作", tags: ["工作"], category: "work", confidence: "inferred" };
  if (/(?:運動|跑步|健身|散步|喝水|睡眠)/i.test(text)) return { text: "我完成了一項身心健康行動", tags: ["健康"], category: "health", confidence: "inferred" };
  if (/(?:閱讀|讀書|學習|課程|練習)/i.test(text)) return { text: "我完成了一項學習行動", tags: ["學習"], category: "learning", confidence: "inferred" };
  if (/(?:整理|清潔|打掃|收拾|家務)/i.test(text)) return { text: "我完成了一項整理行動", tags: ["整理"], category: "organising", confidence: "inferred" };
  return { text: "我完成了一件值得肯定的正向行動", tags: ["正向行動"], category: "other", confidence: "low" };
}

function findCardMatch(ledger, candidate) {
  const exact = ledger.cards.find(card => card.stableKey === candidate.stableKey);
  if (exact) return { card: exact, certainty: "exact_local_key" };
  const candidateName = normaliseName(candidate.title);
  const probable = ledger.cards.find(card => {
    const existingName = normaliseName(card.canonicalName);
    return Math.min(existingName.length, candidateName.length) >= 3 && (existingName.includes(candidateName) || candidateName.includes(existingName));
  });
  return probable ? { card: probable, certainty: "probable_name_match" } : null;
}

function createExternalCaptureFromAiResult(ledger, { rawAiResult, now = new Date().toISOString() }) {
  const inference = inferActivityFromAiResult(rawAiResult);
  const result = createExternalCapture(ledger, { text: inference.text, rawAiResult, tags: inference.tags, now });
  return { ...result, activityInference: inference };
}

function createExternalCapture(ledger, { text, rawAiResult, tags = [], startAt = null, endAt = null, now = new Date().toISOString() }) {
  const extraction = extractNaturalLanguageCard(rawAiResult);
  const registration = extractRegistrationMetadata(rawAiResult);
  if (!text?.trim()) throw new Error("ACTIVITY_TEXT_REQUIRED");
  if (!extraction.title || !extraction.rarity) throw new Error("EXTERNAL_AI_RESULT_NOT_RECOGNISED");
  const reportId = makeId("report");
  const eventId = makeId("evt");
  const activityId = makeId("activity");
  const durationMinutes = startAt && endAt ? Math.max(0, Math.round((new Date(endAt) - new Date(startAt)) / 60000)) : null;
  const report = { id: reportId, text: text.trim(), rawAiResult: rawAiResult.trim(), tags, createdAt: now, eventId, origin: "external_ai_capture" };
  const activity = { id: activityId, reportId, eventId, label: text.trim(), tags, category: classifyActivity({ text, tags }), createdAt: now, startAt, endAt, durationMinutes };
  const candidate = { id: makeId("candidate"), title: extraction.title, stableKey: stableKey({ wikidataQid: registration.wikidataQid, canonicalName: extraction.title }), wikidataQid: registration.wikidataQid, introduction: extraction.introduction, sourceUrl: registration.sourceUrl, sourceTitle: registration.sourceTitle, verificationStatus: "external_ai_unverified" };
  const match = findCardMatch(ledger, candidate);
  const event = { id: eventId, reportId, activityId, rollRarity: null, rollMode: null, rarity: extraction.rarity, requestedMode: "external", resolvedMode: match?.certainty === "exact_local_key" ? "echo_detected" : "external", status: match?.certainty === "exact_local_key" ? "echo_detected" : match ? "possible_echo" : "candidate_ready", origin: "external_ai_capture", rarityProvenance: "AI 外部結果；並非網站先行鎖定", createdAt: now, candidate, echoCardId: match?.card.id ?? null, echoDetection: match?.certainty ?? null, evolutionRequest: null, outcome: null };
  return { ledger: { ...ledger, reports: [report, ...ledger.reports], activities: [activity, ...ledger.activities], events: [event, ...ledger.events], updatedAt: now }, report, activity, event, extraction, duplicate: match?.card ?? null, match };
}

function addReportAndDraw(ledger, { text, tags = [], startAt = null, endAt = null, now = new Date().toISOString(), rolls = null }) {
  const reportId = makeId("report");
  const eventId = makeId("evt");
  const activityId = makeId("activity");
  const rollRarity = rolls?.rarity ?? rollSecurely(10000);
  const rollMode = rolls?.mode ?? rollSecurely(100);
  const rarity = rarityFromRoll(rollRarity);
  const requestedMode = modeFromRoll(rollMode, ledger.settings.echoRate);
  const hasSameRarityCard = ledger.cards.some(card => card.rarity === rarity);
  const resolvedMode = requestedMode === "echo" && !hasSameRarityCard ? "echo_fallback" : requestedMode;
  const durationMinutes = startAt && endAt ? Math.max(0, Math.round((new Date(endAt) - new Date(startAt)) / 60000)) : null;
  const report = { id: reportId, text: text.trim(), tags, createdAt: now, eventId };
  const activity = { id: activityId, reportId, eventId, label: text.trim(), tags, category: classifyActivity({ text, tags }), createdAt: now, startAt, endAt, durationMinutes };
  const event = { id: eventId, reportId, activityId, rollRarity, rollMode, rarity, requestedMode, resolvedMode, status: "awaiting_ai_result", createdAt: now, candidate: null, outcome: null };
  const base = { ...ledger, reports: [report, ...ledger.reports], activities: [activity, ...ledger.activities], events: [event, ...ledger.events], updatedAt: now };
  if (resolvedMode !== "echo") return { ledger: base, report, activity, event };
  const selected = ledger.cards.find(card => card.rarity === rarity);
  if (!selected) return { ledger: base, report, activity, event };
  const newCopy = { id: makeId("inventory"), eventId, cardId: selected.id, itemType: "base_card", title: selected.canonicalName, rarity, createdAt: now };
  const copies = [newCopy, ...ledger.inventory.filter(row => row.itemType === "base_card" && row.cardId === selected.id)];
  let inventory = [newCopy, ...ledger.inventory];
  let fusions = ledger.fusions;
  let outcome = { type: "echo_copy", title: selected.canonicalName, cardId: selected.id };
  if (copies.length >= 2) {
    const consumedIds = copies.slice(0, 2).map(row => row.id);
    inventory = inventory.filter(row => !consumedIds.includes(row.id));
    const fusion = { id: makeId("fusion"), eventId, inputInventoryIds: consumedIds, title: `${selected.canonicalName}・共鳴檔案`, createdAt: now, disclaimer: "遊戲化收藏成就，並非現實的新史實或科學發現。" };
    fusions = [fusion, ...fusions];
    outcome = { type: "fusion", title: fusion.title, fusionId: fusion.id };
  }
  const finalEvent = { ...event, status: "finalized", selectedCardId: selected.id, outcome, finalizedAt: now };
  return { ledger: { ...base, events: base.events.map(row => row.id === eventId ? finalEvent : row), inventory, fusions }, report, activity, event: finalEvent };
}

function candidateForEvent(ledger, eventId, candidate, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event) throw new Error("EVENT_NOT_FOUND");
  const name = candidate.canonicalName?.trim() || candidate.title?.trim();
  if (!name) throw new Error("CANDIDATE_NAME_REQUIRED");
  const key = stableKey({ wikidataQid: candidate.wikidataQid, canonicalName: name });
  const duplicate = ledger.cards.find(card => card.stableKey === key);
  const updated = { ...event, candidate: { id: makeId("candidate"), title: name, stableKey: key, wikidataQid: candidate.wikidataQid?.trim().toUpperCase() || null, introduction: candidate.introduction?.trim() || null, sourceUrl: candidate.sourceUrl?.trim() || null, sourceTitle: candidate.sourceTitle?.trim() || null, verificationStatus: candidate.sourceUrl ? "user_supplied_source" : "unverified" }, status: duplicate ? "duplicate_candidate" : "candidate_ready", updatedAt: now };
  const rawAiResult = typeof candidate.rawAiResult === "string" ? candidate.rawAiResult.trim() : "";
  const reports = rawAiResult ? ledger.reports.map(report => report.id === event.reportId ? { ...report, rawAiResult } : report) : ledger.reports;
  return { ledger: { ...ledger, reports, events: ledger.events.map(row => row.id === eventId ? updated : row), updatedAt: now }, event: updated, duplicate };
}

function duplicateMessage(event, duplicate) {
  return `本機帳本已記錄「${duplicate.canonicalName}」（${duplicate.rarity}）。請為事件 ${event.id} 依原有稀有度 ${event.rarity} 換一個不同的真實主體；不要改變稀有度或重新抽卡。`;
}

function evolutionPrompt(event, card) {
  const requestId = event.evolutionRequest?.id ?? "尚未建立";
  return `這是回響進化，不用更改你原本的誇獎提示詞，也不要重新抽卡。\n\n請把兩張「${card.canonicalName}」（${event.rarity}）合成一個遊戲化收藏；只回覆以下兩行：\n恭喜進化為：【新的進化名稱】\n介紹：一句溫暖的遊戲化介紹\n\n進化請求 ID：${requestId}`;
}

function localEvolutionReply(event, card) {
  return `恭喜進化為：【${card.canonicalName}・雙重回響】\n介紹：由兩張「${card.canonicalName}」合成的本機遊戲化收藏，紀念你這次好好照顧自己的小小堅持。`;
}

function prepareEvolution(ledger, eventId, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event || event.status !== "echo_detected" || !event.echoCardId) throw new Error("EVOLUTION_NOT_AVAILABLE");
  const card = ledger.cards.find(row => row.id === event.echoCardId);
  if (!card) throw new Error("ECHO_CARD_NOT_FOUND");
  const request = { id: makeId("evolve"), eventId, cardId: card.id, rarity: event.rarity, createdAt: now, status: "awaiting_ai_evolution" };
  const updated = { ...event, status: "awaiting_evolution", evolutionRequest: request, updatedAt: now };
  return { ledger: { ...ledger, events: ledger.events.map(row => row.id === eventId ? updated : row), updatedAt: now }, event: updated, card, request };
}

function acceptPossibleEcho(ledger, eventId, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event || event.status !== "possible_echo" || !event.echoCardId) throw new Error("POSSIBLE_ECHO_NOT_AVAILABLE");
  const updated = { ...event, status: "echo_detected", resolvedMode: "echo_detected", echoDetection: "user_confirmed_name_match", updatedAt: now };
  return { ledger: { ...ledger, events: ledger.events.map(row => row.id === eventId ? updated : row), updatedAt: now }, event: updated };
}

function extractEvolutionResult(raw) {
  const text = raw.trim();
  const match = text.match(/(?:恭喜\s*)?(?:進化(?:為|結果)?|進階(?:為|版本)?|升級(?:為)?)\s*[：:]?\s*(?:【\s*([^】\n]+)\s*】|\[\s*([^\]\n]+)\s*\]|([^\n（）()]+))/i);
  const title = (match?.[1] ?? match?.[2] ?? match?.[3])?.trim() ?? null;
  const afterEvolution = match ? text.slice((match.index ?? 0) + match[0].length) : text;
  const introduction = afterEvolution.match(/(?:✨\s*)?(?:介紹|說明)\s*[：:]\s*([\s\S]*?)(?=\n\s*(?:🎬|\[場記板|當前已解鎖|合成規則)|$)/i)?.[1]?.trim() ?? null;
  return { title, introduction };
}

function finaliseEvolution(ledger, eventId, rawAiResult, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event || event.status !== "awaiting_evolution" || !event.echoCardId || !event.evolutionRequest) throw new Error("EVOLUTION_NOT_READY");
  const result = extractEvolutionResult(rawAiResult);
  if (!result.title) throw new Error("EVOLUTION_RESULT_NOT_RECOGNISED");
  const sourceCard = ledger.cards.find(card => card.id === event.echoCardId);
  if (!sourceCard) throw new Error("ECHO_CARD_NOT_FOUND");
  const existingCopy = ledger.inventory.find(item => item.itemType === "base_card" && (item.cardId ?? item.itemId) === sourceCard.id);
  const echoCopy = { id: makeId("inventory"), eventId, cardId: sourceCard.id, itemType: "base_card", title: sourceCard.canonicalName, rarity: event.rarity, createdAt: now, origin: "echo_detected" };
  if (!existingCopy) {
    const updated = { ...event, status: "finalized", outcome: { type: "echo_copy", cardId: sourceCard.id, title: sourceCard.canonicalName, note: "圖鑑有同物記錄，但背包沒有可合成的既有基礎卡；本次先加入一張回響卡。" }, finalizedAt: now };
    return { ledger: { ...ledger, inventory: [echoCopy, ...ledger.inventory], events: ledger.events.map(row => row.id === eventId ? updated : row), updatedAt: now }, event: updated, fusion: null };
  }
  const evolutionItem = { id: makeId("evolved"), eventId, sourceCardId: sourceCard.id, itemType: "evolved_card", title: result.title, rarity: event.rarity, introduction: result.introduction, createdAt: now, disclaimer: "遊戲化收藏成就，並非現實的新史實或科學發現。" };
  const fusion = { id: makeId("fusion"), eventId, requestId: event.evolutionRequest.id, sourceCardId: sourceCard.id, inputInventoryIds: [existingCopy.id, echoCopy.id], evolutionItemId: evolutionItem.id, title: evolutionItem.title, rawEvolutionResult: rawAiResult.trim(), createdAt: now, disclaimer: evolutionItem.disclaimer };
  const updated = { ...event, status: "finalized", outcome: { type: "evolution", fusionId: fusion.id, title: evolutionItem.title }, finalizedAt: now };
  return { ledger: { ...ledger, inventory: [evolutionItem, ...ledger.inventory.filter(item => item.id !== existingCopy.id)], fusions: [fusion, ...ledger.fusions], events: ledger.events.map(row => row.id === eventId ? updated : row), updatedAt: now }, event: updated, fusion };
}

function naturalLanguagePrompt(event, reportText) {
  const mode = event.resolvedMode === "echo_fallback" ? "探索（回響候選不足）" : event.resolvedMode;

function updateActivityCategory(ledger, activityId, category, now = new Date().toISOString()) {
  if (!CATEGORY_META[category]) throw new Error("ACTIVITY_CATEGORY_INVALID");
  if (!ledger.activities.some(activity => activity.id === activityId)) throw new Error("ACTIVITY_NOT_FOUND");
  return { ...ledger, activities: ledger.activities.map(activity => activity.id === activityId ? { ...activity, category, label: activity.category === category ? activity.label : activityTitleForCategory(category), updatedAt: now } : activity), updatedAt: now };
}

function activityTitleForCategory(category) {
  return `我完成了一項${CATEGORY_META[category]?.label ?? CATEGORY_META.other.label}行動`;
}

/** 所有事件均可在本機修正；唯一固定的是事件 ID。 */
function updateEventRecord(ledger, eventId, edits, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event) throw new Error("EVENT_NOT_FOUND");
  const currentActivity = ledger.activities.find(row => row.id === event.activityId);
  const action = String(edits.text ?? "").trim();
  if (!action) throw new Error("ACTIVITY_TEXT_REQUIRED");
  const tags = Array.isArray(edits.tags) ? edits.tags.map(tag => String(tag).trim()).filter(Boolean).slice(0, 10) : [];
  const category = CATEGORY_META[edits.category] ? edits.category : currentActivity?.category ?? "other";
  const categoryChanged = category !== currentActivity?.category;
  const suppliedLabel = String(edits.displayLabel ?? "").trim();
  const label = categoryChanged ? activityTitleForCategory(category) : suppliedLabel || action;
  const startAt = edits.startAt || null;
  const endAt = edits.endAt || null;
  const durationMinutes = startAt && endAt ? Math.max(0, Math.round((new Date(endAt) - new Date(startAt)) / 60000)) : null;
  const previousCard = ledger.cards.find(card => card.id === event.outcome?.cardId || card.id === event.echoCardId || card.eventId === eventId) ?? null;
  const hasEdit = key => Object.prototype.hasOwnProperty.call(edits, key);
  const editText = (key, current = "") => hasEdit(key) ? String(edits[key] ?? "").trim() : String(current ?? "").trim();
  const cardTitle = editText("cardTitle", previousCard?.canonicalName ?? event.candidate?.title);
  if ((previousCard || event.candidate) && !cardTitle) throw new Error("CARD_TITLE_REQUIRED");
  const editedRarity = editText("cardRarity", event.rarity).toUpperCase();
  const cardRarity = /^(N|R|SR|SSR|UR)$/.test(editedRarity) ? editedRarity : event.rarity;
  const wikidataQid = editText("wikidataQid", previousCard?.wikidataQid ?? event.candidate?.wikidataQid).toUpperCase() || null;
  const sourceUrl = editText("sourceUrl", previousCard?.sourceUrl ?? event.candidate?.sourceUrl) || null;
  const sourceTitle = editText("sourceTitle", previousCard?.sourceTitle ?? event.candidate?.sourceTitle) || null;
  const introduction = editText("introduction", previousCard?.introduction ?? event.candidate?.introduction) || null;
  const rawAiResult = editText("rawAiResult", event.rawAiResult ?? ledger.reports.find(report => report.id === event.reportId)?.rawAiResult);
  const cardPatch = cardTitle ? { canonicalName: cardTitle, rarity: cardRarity, wikidataQid, stableKey: stableKey({ wikidataQid, canonicalName: cardTitle }), introduction, sourceUrl, sourceTitle, updatedAt: now } : null;
  const nextCandidate = event.candidate && cardTitle ? { ...event.candidate, title: cardTitle, rarity: cardRarity, wikidataQid, stableKey: stableKey({ wikidataQid, canonicalName: cardTitle }), introduction, sourceUrl, sourceTitle, updatedAt: now } : event.candidate;
  const nextOutcomeTitle = cardTitle || event.outcome?.title || null;
  const nextEvent = { ...event, rarity: cardRarity, candidate: nextCandidate, outcome: event.outcome ? { ...event.outcome, ...(nextOutcomeTitle ? { title: nextOutcomeTitle } : {}) } : event.outcome, rawAiResult, manuallyEditedAt: now, updatedAt: now };
  const cardIds = new Set([event.outcome?.cardId, event.echoCardId, previousCard?.id].filter(Boolean));
  const fusionId = event.outcome?.fusionId;
  return {
    ...ledger,
    reports: ledger.reports.map(report => report.id === event.reportId ? { ...report, text: action, tags, rawAiResult, updatedAt: now } : report),
    activities: ledger.activities.map(activity => activity.id === event.activityId ? { ...activity, label, tags, category, startAt, endAt, durationMinutes, updatedAt: now } : activity),
    cards: cardPatch ? ledger.cards.map(card => cardIds.has(card.id) || card.eventId === eventId ? { ...card, ...cardPatch } : card) : ledger.cards,
    inventory: ledger.inventory.map(item => item.eventId === eventId && item.itemType === "evolved_card" && cardTitle ? { ...item, title: cardTitle, rarity: cardRarity, introduction, updatedAt: now } : item),
    fusions: ledger.fusions.map(fusion => fusion.id === fusionId && cardTitle ? { ...fusion, title: cardTitle, updatedAt: now } : fusion),
    events: ledger.events.map(row => row.id === eventId ? nextEvent : row),
    updatedAt: now,
  };
}

/** 安全移除一個本機事件及只屬於它的資料；被其他事件使用的基礎卡不可直接刪除。 */
function deleteEvent(ledger, eventId, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event) throw new Error("EVENT_NOT_FOUND");
  const ownCards = ledger.cards.filter(card => card.eventId === eventId);
  const ownCardIds = new Set(ownCards.map(card => card.id));
  const usedByOtherRecords = [...ownCardIds].filter(cardId =>
    ledger.inventory.some(item => item.cardId === cardId && item.eventId !== eventId)
    || ledger.events.some(other => other.id !== eventId && (other.echoCardId === cardId || other.outcome?.cardId === cardId))
    || ledger.fusions.some(fusion => fusion.eventId !== eventId && fusion.sourceCardId === cardId),
  );
  if (usedByOtherRecords.length) throw new Error("EVENT_DELETE_HAS_DEPENDENTS");
  const deletedFusions = ledger.fusions.filter(fusion => fusion.eventId === eventId);
  const restoreBaseCopies = deletedFusions.flatMap(fusion => {
    const sourceCard = ledger.cards.find(card => card.id === fusion.sourceCardId);
    if (!sourceCard || ledger.inventory.some(item => item.itemType === "base_card" && item.cardId === sourceCard.id)) return [];
    return [{ id: fusion.inputInventoryIds?.[0] ?? makeId("inventory"), eventId: sourceCard.eventId ?? null, cardId: sourceCard.id, itemType: "base_card", title: sourceCard.canonicalName, rarity: sourceCard.rarity, createdAt: now, origin: "restored_after_event_delete" }];
  });
  const fusionIds = new Set(deletedFusions.map(fusion => fusion.id));
  const evolutionItemIds = new Set(deletedFusions.map(fusion => fusion.evolutionItemId).filter(Boolean));
  const next = {
    ...ledger,
    reports: ledger.reports.filter(report => report.id !== event.reportId),
    activities: ledger.activities.filter(activity => activity.id !== event.activityId),
    events: ledger.events.filter(row => row.id !== eventId),
    cards: ledger.cards.filter(card => !ownCardIds.has(card.id)),
    inventory: [...ledger.inventory.filter(item => item.eventId !== eventId && !evolutionItemIds.has(item.id)), ...restoreBaseCopies],
    fusions: ledger.fusions.filter(fusion => !fusionIds.has(fusion.id)),
    updatedAt: now,
  };
  return { ledger: next, deletedEvent: event, deletedCardCount: ownCards.length, deletedFusionCount: deletedFusions.length };
}

/** 舊介面相容：仍可用原本函式更新等待中事件。 */
function updatePendingEvent(ledger, eventId, { text, tags = [], startAt = null, endAt = null }, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event) throw new Error("EVENT_NOT_FOUND");
  if (["finalized", "cancelled"].includes(event.status)) throw new Error("EVENT_ALREADY_FINALIZED");
  const activity = ledger.activities.find(row => row.id === event.activityId);
  return updateEventRecord(ledger, eventId, { text, tags, category: classifyActivity({ text, tags }), displayLabel: String(text ?? ""), startAt, endAt }, now);
}

function confirmCandidate(ledger, eventId, now = new Date().toISOString()) {
  const event = ledger.events.find(row => row.id === eventId);
  if (!event?.candidate) throw new Error("CANDIDATE_NOT_READY");
  if (event.status === "duplicate_candidate") throw new Error("CANDIDATE_ALREADY_OWNED");
  const candidate = event.candidate;
  const card = { id: makeId("card"), stableKey: candidate.stableKey, canonicalName: candidate.title, wikidataQid: candidate.wikidataQid, rarity: event.rarity, introduction: candidate.introduction, sourceUrl: candidate.sourceUrl, sourceTitle: candidate.sourceTitle, verificationStatus: candidate.verificationStatus, unlockedAt: now, eventId };
  const eventUpdated = { ...event, status: "finalized", outcome: { type: "base_card", cardId: card.id, title: card.canonicalName }, finalizedAt: now };
  const inventory = [...ledger.inventory, { id: makeId("inventory"), eventId, cardId: card.id, itemType: "base_card", title: card.canonicalName, rarity: card.rarity, createdAt: now }];
  let cards = [card, ...ledger.cards];
  let fusions = ledger.fusions;
  const matching = inventory.filter(row => row.itemType === "base_card" && row.itemId === card.id);
  if (matching.length >= 2) {
    const fusion = { id: makeId("fusion"), eventId, inputCardIds: matching.slice(0, 2).map(row => row.itemId), title: `${card.canonicalName}・共鳴檔案`, createdAt: now, disclaimer: "遊戲化收藏成就，並非現實的新史實或科學發現。" };
    fusions = [fusion, ...fusions];
  }
  return { ledger: { ...ledger, cards, inventory, fusions, events: ledger.events.map(row => row.id === eventId ? eventUpdated : row), updatedAt: now }, event: eventUpdated, card };
}

async function checksum(text) {
  const data = new TextEncoder().encode(text);
  const hash = await globalThis.crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(hash)].map(value => value.toString(16).padStart(2, "0")).join("");
}

async function exportBackup(ledger) {
  const data = { ...ledger, exportedAt: new Date().toISOString() };
  const canonical = JSON.stringify(data);
  return JSON.stringify({ backupVersion: BACKUP_VERSION, checksum: await checksum(canonical), data }, null, 2);
}

async function validateBackup(raw) {
  const envelope = JSON.parse(raw);
  if (envelope?.backupVersion !== BACKUP_VERSION || !envelope?.data || typeof envelope.checksum !== "string") throw new Error("BACKUP_VERSION_OR_SHAPE_INVALID");
  const actual = await checksum(JSON.stringify(envelope.data));
  if (actual !== envelope.checksum) throw new Error("BACKUP_CHECKSUM_INVALID");
  return envelope.data;
}

const MERGE_COLLECTIONS = ["reports", "events", "cards", "inventory", "fusions", "activities"];

function comparableRow(row) {
  const { id, createdAt, updatedAt, ...rest } = row ?? {};
  return JSON.stringify(rest);
}

/** 在合併前找出分岔帳本中相同識別資料的內容衝突。 */
function findMergeConflicts(current, incoming) {
  const conflicts = [];
  for (const collection of MERGE_COLLECTIONS) {
    const currentById = new Map((current[collection] ?? []).filter(row => row?.id).map(row => [row.id, row]));
    for (const incomingRow of incoming[collection] ?? []) {
      const existing = incomingRow?.id ? currentById.get(incomingRow.id) : null;
      if (existing && comparableRow(existing) !== comparableRow(incomingRow)) {
        conflicts.push({ collection, kind: "same_id", identifier: incomingRow.id });
      }
    }
  }
  const cardsByStableKey = new Map((current.cards ?? []).filter(card => card?.stableKey).map(card => [card.stableKey, card]));
  for (const incomingCard of incoming.cards ?? []) {
    const existing = incomingCard?.stableKey ? cardsByStableKey.get(incomingCard.stableKey) : null;
    if (existing && existing.id !== incomingCard.id && comparableRow(existing) !== comparableRow(incomingCard)) {
      conflicts.push({ collection: "cards", kind: "stable_key", identifier: incomingCard.stableKey });
    }
  }
  return conflicts;
}

function mergeLedgers(current, incoming, now = new Date().toISOString()) {
  if (incoming?.backupVersion !== BACKUP_VERSION) throw new Error("BACKUP_VERSION_OR_SHAPE_INVALID");
  const conflicts = findMergeConflicts(current, incoming);
  if (conflicts.length) {
    const error = new Error("BACKUP_MERGE_CONFLICT");
    error.conflicts = conflicts;
    throw error;
  }
  const mergeById = (left, right) => {
    const seen = new Set(left.map(row => row.id));
    return [...left, ...right.filter(row => row?.id && !seen.has(row.id))];
  };
  const existingKeys = new Set(current.cards.map(card => card.stableKey));
  const cards = [...current.cards, ...incoming.cards.filter(card => card?.stableKey && !existingKeys.has(card.stableKey))];
  return {
    ...current,
    reports: mergeById(current.reports, incoming.reports ?? []),
    events: mergeById(current.events, incoming.events ?? []),
    activities: mergeById(current.activities, incoming.activities ?? []),
    cards,
    inventory: mergeById(current.inventory, incoming.inventory ?? []),
    fusions: mergeById(current.fusions, incoming.fusions ?? []),
    updatedAt: now,
  };
}

function localDayKey(date, timezone) {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: timezone, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(date);
  const value = Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, part.value]));
  return `${value.year}-${value.month}-${value.day}`;
}

function activityDayKey(activity, timezone) {
  if (/^\d{4}-\d{2}-\d{2}T/.test(activity.startAt ?? "")) return activity.startAt.slice(0, 10);
  return localDayKey(new Date(activity.createdAt), timezone);
}

function statistics(ledger, period = "week", now = new Date()) {
  const days = period === "month" ? 30 : period === "week" ? 7 : 1;
  const timezone = ledger.settings?.timezone || "Asia/Hong_Kong";
  const dayKeys = Array.from({ length: days }, (_, index) => {
    const day = new Date(now);
    day.setDate(day.getDate() - days + 1 + index);
    return localDayKey(day, timezone);
  });
  const activities = ledger.activities.filter(activity => dayKeys.includes(activityDayKey(activity, timezone)));
  const timeline = dayKeys.map(day => { const rows = activities.filter(activity => activityDayKey(activity, timezone) === day); return { day, reports: rows.length, minutes: rows.reduce((sum, row) => sum + (row.durationMinutes ?? 0), 0) }; });
  const tags = Object.entries(activities.flatMap(activity => activity.tags).reduce((map, tag) => ({ ...map, [tag]: (map[tag] ?? 0) + 1 }), {})).sort((a, b) => b[1] - a[1]);
  const categories = Object.entries(CATEGORY_META).map(([key, meta]) => ({ key, label: meta.label, color: meta.color, count: activities.filter(activity => (activity.category ?? classifyActivity(activity)) === key).length })).filter(category => category.count > 0);
  const rarities = ["N", "R", "SR", "SSR", "UR"].map(rarity => [rarity, ledger.events.filter(event => event.rarity === rarity).length]);
  return { timeline, tags, categories, rarities, totalMinutes: activities.reduce((sum, row) => sum + (row.durationMinutes ?? 0), 0) };
}

  <aside class="side-stack"><section class="panel rule-card"><p class="eyebrow">LOCAL RULES</p><p><strong>N 50%</strong>　R 30%　SR 15%</p><p>SSR 4%　UR 1%</p><hr><p class="muted">探索 ${100 - ledger.settings.echoRate}% · 回響 ${ledger.settings.echoRate}%</p></section><section class="panel rule-card"><p><strong>不必登入，不用 API</strong></p><p class="micro">事件、物件與活動 ID 均由網站在本機建立。不同人的瀏覽器資料不會互相看到。</p></section></aside></div>
  ${event ? renderEventWorkspace(event) : ""}
  <section class="section panel"><div class="panel-head"><div><p class="eyebrow">ONE-PASTE AI CAPTURE</p><h2>貼入智譜回覆，其他交給網站</h2><p class="micro">不必填行動、標籤、ID、模式或卡牌欄位。網站只會讀取你貼上的一段文字：自動推斷行動、建立本機 ID、分類、讀取卡牌及比對圖鑑。</p></div></div><form id="external-capture-form" class="panel-body" novalidate><label class="micro">貼入智譜整段回覆<textarea name="rawAiResult" class="input natural-input" placeholder="直接貼入完整回覆，例如：🌟 照顧自己的身體……恭喜獲得：【一片金黃的銀杏葉】（稀有度：N）……"></textarea></label><button class="button section" type="submit">自動讀取並告訴我下一步</button></form></section>
  <section class="section"><div class="section-title"><h2>等待處理的盲盒</h2><span class="mono">${pending.length} PENDING</span></div>${pending.length ? `<div class="event-list">${pending.slice(0,8).map(event => `<div class="event-row"><div>${rarityBadge(event.rarity)}<strong>${modeLabel(event)}</strong><p>${e(event.id)} · ${dateLabel(event.createdAt)}</p></div><div class="actions"><button class="button secondary small" data-resume="${e(event.id)}">繼續此事件</button></div></div>`).join("")}</div>` : empty("尚未有待處理事件。先寫下一件剛完成或照顧自己的事。")}</section>`;
}

function renderMobileCaptureHome(event) {
  const profile = ledger.settings.profile ?? {};
  if (event) return `<section class="mobile-capture-flow"><p class="eyebrow">第 2 步／確認盲盒</p><h1>${profile.displayName ? `${e(profile.displayName)}，讀取完成` : "讀取完成"}</h1><p class="mobile-lead">網站已在本機建立活動和事件 ID。現在只需完成下面這一個動作。</p><section class="panel mobile-result-panel" id="active-event">${renderCandidateEditor(event, event.candidate, null)}</section><p class="mobile-switch-note">想看圖鑑、行動時間或備份，請用上方選單切換。</p></section>`;
  if (inputMode === "local") return `<section class="mobile-capture-flow"><p class="eyebrow">第 1 步／先領取盲盒</p><h1>先說你完成了甚麼</h1><p class="mobile-lead">按下按鈕後，提示會自動複製；網站會直接帶你到貼回位置。</p><form id="draw-form" class="panel mobile-paste-form"><label class="micro" for="mobile-action-text">這次做了甚麼</label><textarea id="mobile-action-text" required name="text" class="input natural-input" placeholder="例如：我完成了今天的工作，正在回家。"></textarea><details class="mobile-more"><summary>標籤與時間（可選）</summary><label class="micro">標籤<input name="tags" class="input" placeholder="例如：工作、回家" /></label><div class="inline-fields"><label>開始<input type="datetime-local" name="startAt" /></label><label>結束<input type="datetime-local" name="endAt" /></label></div></details><button class="button" type="submit">領取盲盒並複製提示</button></form><button class="button secondary mobile-switch-button" type="button" data-show-external>我已有智譜回覆，直接貼入</button></section>`;
  return `<section class="mobile-capture-flow"><p class="eyebrow">第 1 步／貼上回覆</p><h1>把智譜完整回覆貼在這裡</h1><p class="mobile-lead">不用填行動、分類、ID 或技術欄位。複製智譜回覆、貼上、按一次讀取即可。</p><ol class="mobile-steps"><li>複製智譜完整回覆</li><li>貼在下方</li><li>按「讀取盲盒」</li></ol><form id="external-capture-form" class="panel mobile-paste-form" novalidate><label class="micro" for="mobile-ai-result">貼入完整智譜回覆</label><textarea id="mobile-ai-result" name="rawAiResult" class="input natural-input" placeholder="直接貼入完整回覆；有重複段落或 CARD-REGISTRATION 也可以。"></textarea><button class="button" type="submit">讀取盲盒，告訴我下一步</button></form><button class="button secondary mobile-switch-button" type="button" data-show-local>我想先領取盲盒，再交給智譜</button></section>`;
}

function renderEventWorkspace(event) {
  const report = ledger.reports.find(row => row.id === event.reportId);
  const candidate = event.candidate;
  const isExternal = event.origin === "external_ai_capture";
  const duplicate = event.status === "duplicate_candidate" ? ledger.cards.find(card => card.stableKey === candidate?.stableKey) : null;
  if (isExternal) return renderExternalEventWorkspace(event, candidate, duplicate);
  if (globalThis.matchMedia?.("(max-width: 560px)")?.matches) return renderMobileLocalEventWorkspace(event, report, candidate, duplicate);
  return `<section class="panel draw-workspace" id="active-event"><div class="draw-top"><div><p class="eyebrow">EVENT / ${e(event.id)}</p><strong>${modeLabel(event)}</strong><p class="micro">${isExternal ? "AI 外部結果：稀有度由貼入內容聲稱，未由網站先行鎖定。" : `本機骰值已鎖定：${event.rollRarity} · ${event.rollMode}`}</p></div>${rarityBadge(event.rarity)}</div>
  ${event.status === "finalized" ? `<div class="panel-body"><div class="success">此事件已結算：${e(event.outcome?.title ?? "已加入圖鑑")}。</div></div>` : `<div class="draw-body"><div class="draw-column"><h2>${isExternal ? "已直接補錄，現在核對候選" : "第一步：把這段交給智譜"}</h2><p class="micro">${isExternal ? "系統從你貼入的文字讀取候選卡；你仍可在右側補充權威來源和主體鍵。" : "智譜只需用自然語言誇獎、抽取與介紹；網站會讀取結果並管理 ID。"}</p>${isExternal ? "" : `<pre class="prompt-box">${e(naturalLanguagePrompt(event, report?.text ?? ""))}</pre><button class="button secondary small" data-copy-prompt="${e(event.id)}">複製給智譜</button><form id="ai-result-form" data-event-id="${e(event.id)}" class="section"><label class="micro">把智譜整段結果貼回<textarea required class="input natural-input" name="rawResult" placeholder="恭喜獲得：【名稱】（稀有度：${e(event.rarity)}）…"></textarea></label><button class="button small" type="submit">讀取候選卡</button></form>`}</div><div class="draw-column">${candidate ? renderCandidateEditor(event, candidate, duplicate) : `<h2>第二步：貼回智譜結果</h2><p class="micro">請先在左邊把提示交給智譜，再貼回其自然語言結果。網站會讀取卡名、稀有度和介紹，不要求技術格式。</p>`}</div></div>`}</section>`;
}

function renderMobileLocalEventWorkspace(event, report, candidate, duplicate) {
  if (event.status === "finalized") return `<section class="panel draw-workspace" id="active-event"><div class="panel-body"><div class="success">此事件已結算：${e(event.outcome?.title ?? "已加入圖鑑")}。</div></div></section>`;
  if (candidate) return `<section class="panel mobile-result-panel" id="active-event">${renderCandidateEditor(event, candidate, duplicate)}</section>`;
  return `<section class="mobile-flow-step" id="active-event"><p class="eyebrow">第 2 步／貼回智譜結果</p><h2>提示已複製，現在貼回回覆</h2><p class="mobile-lead">先把剛才自動複製的文字貼給智譜；收到完整回覆後，直接貼在下面。</p><details class="mobile-more"><summary>看提示或再次複製</summary><pre class="prompt-box">${e(naturalLanguagePrompt(event, report?.text ?? ""))}</pre><button class="button secondary small" data-copy-prompt="${e(event.id)}">再次複製提示</button></details><form id="ai-result-form" data-event-id="${e(event.id)}" class="panel mobile-paste-form"><label class="micro" for="mobile-pasted-result">貼入智譜完整回覆</label><textarea id="mobile-pasted-result" required class="input natural-input" name="rawResult" placeholder="直接貼入完整回覆；不需填 ID 或技術欄位。"></textarea><button class="button" type="submit">讀取候選卡，前往下一步</button></form></section>`;
}

function renderExternalEventWorkspace(event, candidate, duplicate) {
  return `<section class="panel draw-workspace" id="active-event"><div class="draw-top"><div><p class="eyebrow">EVENT / ${e(event.id)}</p><strong>已讀取智譜回覆</strong><p class="micro">AI 外部結果：稀有度由貼入內容聲稱，未由網站先行鎖定。</p></div>${rarityBadge(event.rarity)}</div><div class="panel-body">${event.status === "finalized" ? `<div class="success">此事件已結算：${e(event.outcome?.title ?? "已加入圖鑑")}。</div>` : `<p class="micro">這個事件已集中在這裡。確認候選卡即可完成；技術欄位只在你想補充時才需要。</p>${candidate ? renderCandidateEditor(event, candidate, duplicate) : empty("這段文字尚未有可確認的候選卡。")}`}</div></section>`;
}

function renderCandidateEditor(event, candidate, duplicate) {
  const echoCard = event.echoCardId ? ledger.cards.find(card => card.id === event.echoCardId) : null;
  if (event.status === "possible_echo" && echoCard) return `<h2>這可能是既有收藏</h2><div class="warning"><strong>${e(candidate.title)}</strong> 和圖鑑中的「${e(echoCard.canonicalName)}」名稱相近，但網站不能可靠判定。你只需按一個選項：視為同一物件則開始進化；視為不同物件則加入新卡。</div><div class="filter-row"><button class="button" data-accept-possible-echo="${e(event.id)}">是同一物件，進化</button><button class="button secondary" data-treat-new="${e(event.id)}">不是同一物件，加入新卡</button></div>`;
  if (event.status === "echo_detected" && echoCard) return `<h2>偵測到回響：${e(echoCard.canonicalName)}</h2><div class="success">網站已依本機同物鍵判定這是同一張基礎卡。這不是重抽：原 AI 所給的 ${e(event.rarity)} 級會被保留，兩張卡可進化成一個遊戲化收藏。</div><button class="button section" data-start-evolution="${e(event.id)}">建立進化請求 ID</button><p class="micro section">按下後，網站會生成一段補充提示。你只要把它貼給原本的智譜對話，不需改變既有提示詞。</p>`;
  if (event.status === "awaiting_evolution" && echoCard) return `<section class="evolution-quick"><h2>回響進化</h2><p class="micro">兩張「${e(echoCard.canonicalName)}」已準備好合成。選一個做法即可。</p><div class="quick-actions"><button class="button" data-finish-local-evolution="${e(event.id)}">直接完成本機進化</button><button class="button secondary" data-open-ai-evolution>我已有智譜進化回覆</button></div></section><details id="ai-evolution-options" class="section"><summary class="micro">想讓智譜幫你取進化名稱才展開</summary><div class="section"><pre class="prompt-box">${e(evolutionPrompt(event, echoCard))}</pre><button class="button secondary small" data-copy-evolution="${e(event.id)}">複製短提示</button></div><form id="evolution-result-form" data-event-id="${e(event.id)}" class="section"><label class="micro">貼入智譜進化回覆<textarea required name="rawEvolution" class="input natural-input" placeholder="恭喜進化為：【銀杏葉・秋日守護者】\n介紹：……"></textarea></label><button class="button small" type="submit">讀取進化結果並完成替換</button></form></details>`;
  if (duplicate) return `<h2>這張已在圖鑑中</h2><div class="warning"><strong>${e(duplicate.canonicalName)}</strong> 已是你的 ${e(duplicate.rarity)} 級收藏。探索抽不會把它直接變成第二張卡；請用下方重選提示要求智譜依原稀有度換一個未收藏的新主體。</div><pre class="prompt-box">${e(duplicateMessage(event, duplicate))}</pre><button class="button secondary small" data-copy-duplicate="${e(event.id)}">複製重選提示</button><p class="micro section">回響抽才會把既有同卡加入背包，第二張會自動進化；此事件是 ${e(modeLabel(event))}，因此不重擲骰。</p>`;
  const sourceState = candidate.sourceUrl ? "已補上來源；網站保留為使用者提供來源。" : "尚未提供來源；仍可作私人遊戲化收藏，但會在圖鑑標示「未核實」。";
  return `<h2>新的候選卡：${e(candidate.title)}</h2><p class="micro">讀取介紹：${e(candidate.introduction ?? "沒有介紹文字")}</p><div class="success">網站判定這是新物件。下一步只需按下「加入本機圖鑑」；來源欄位是日後想核實時才需要補充。</div><form id="candidate-form" data-event-id="${e(event.id)}" class="section"><details><summary class="micro">想補充 Wikidata 或來源才展開</summary><div class="inline-fields"><label>名稱<input name="title" value="${e(candidate.title)}" required /></label><label>Wikidata QID（可選）<input name="wikidataQid" value="${e(candidate.wikidataQid ?? "")}" placeholder="例如 Q…" /></label><label>權威來源網址（可選）<input type="url" name="sourceUrl" value="${e(candidate.sourceUrl ?? "")}" placeholder="https://…" /></label><label>來源名稱（可選）<input name="sourceTitle" value="${e(candidate.sourceTitle ?? "")}" /></label></div></details><p class="micro section">${e(sourceState)}</p><button class="button" type="submit">加入本機圖鑑</button></form>`;
}

function renderManage() {
  const pending = ledger.events.filter(event => !["finalized", "cancelled"].includes(event.status));
  const allEvents = ledger.events;
  const selected = activeEvent();
  if (globalThis.matchMedia?.("(max-width: 560px)")?.matches && selected?.candidate && !["finalized", "cancelled"].includes(selected.status)) return renderMobileManageCandidate(selected, pending);
  return `${pageHead("EVENTS / ONE PLACE", "管理所有本機事件", "事件 ID 由網站自動管理且不會改變；其餘行動、分類、時間、盲盒資料和完整回覆都可在這裡修改並保存。", `<span class="badge">${pending.length} 進行中</span>`)}${localOnlyNotice("管理事件、預覽內容與處理回響")}
  ${selected ? `${renderEventEditForm(selected)}${renderEventWorkspace(selected)}` : empty("目前沒有事件。到「1. 輸入」建立事件或貼入智譜完整回覆。")}
  ${allEvents.length ? `<details class="section pending-events"><summary>全部事件（${allEvents.length}；${pending.length} 進行中）</summary><div class="event-list section">${allEvents.map(event => `<article class="event-row ${selected?.id === event.id ? "selected-event" : ""}"><div>${rarityBadge(event.rarity)}<strong>${event.status === "finalized" ? "已結算，可修正資料" : modeLabel(event)}</strong><p>${e(event.id)} · ${dateLabel(event.createdAt)}</p></div><div class="actions"><button class="button ${selected?.id === event.id ? "secondary" : ""} small" data-open-event="${e(event.id)}">${selected?.id === event.id ? "正在檢視" : "查看／修正"}</button></div></article>`).join("")}</div></details>` : ""}`;
}

function renderMobileManageCandidate(selected, pending) {
  return `<section class="mobile-capture-flow mobile-manage-focus"><p class="eyebrow">第 3 步／確認盲盒</p><h1>確認這張盲盒卡</h1><p class="mobile-lead">卡名、稀有度和介紹已讀取。現在只需完成下方唯一動作。</p>${renderEventWorkspace(selected)}<details class="panel event-edit"><summary><strong>需要修正這次紀錄？</strong><span>可改行動、標籤與時間；不會改變已鎖定的盲盒規則。</span></summary>${renderEventEditForm(selected).replace(/^<details[^>]*>|<\/details>$/g, "")}</details>${pending.length > 1 ? `<details class="section pending-events"><summary>其他進行中事件（${pending.length - 1}）</summary><div class="event-list section">${pending.filter(event => event.id !== selected.id).map(event => `<article class="event-row"><div>${rarityBadge(event.rarity)}<strong>${e(modeLabel(event))}</strong><p>${e(event.id)} · ${dateLabel(event.createdAt)}</p></div><button class="button secondary small" data-open-event="${e(event.id)}">處理這個事件</button></article>`).join("")}</div></details>` : ""}</section>`;
}

function renderEventEditForm(event) {
  const report = ledger.reports.find(row => row.id === event.reportId);
  const activity = ledger.activities.find(row => row.id === event.activityId);
  const card = ledger.cards.find(row => row.id === event.outcome?.cardId || row.id === event.echoCardId || row.eventId === event.id);
  const cardData = card ?? event.candidate ?? {};
  const open = globalThis.matchMedia?.("(min-width: 561px)")?.matches ? "open" : "";
  return `<details class="panel event-edit" ${open}><summary><strong>查看／修正這次紀錄</strong><span>只有事件 ID 固定；其餘資料修改後可保存。</span></summary><form id="event-edit-form" data-event-id="${e(event.id)}" class="event-edit-form"><section class="event-edit-group"><h3>行動與分類</h3><label>原始行動<textarea name="text" required class="input">${e(report?.text ?? activity?.label ?? "")}</textarea></label><label>清單顯示標題<input name="displayLabel" value="${e(activity?.label ?? report?.text ?? "")}" placeholder="例如：我完成了一項身心健康行動" /></label><div class="inline-fields"><label>目前分類<select name="category">${categoryOptions(activity?.category ?? "other")}</select></label><label>標籤（可選）<input name="tags" value="${e((activity?.tags ?? report?.tags ?? []).join("、"))}" placeholder="例如：工作、回家" /></label></div><p class="micro">更改分類時，清單顯示標題會同步更新為新分類；原始行動文字會保留。</p></section><section class="event-edit-group"><h3>時間</h3><div class="inline-fields"><label>開始（可選）<input type="datetime-local" name="startAt" value="${e(inputDateTime(activity?.startAt))}" /></label><label>結束（可選）<input type="datetime-local" name="endAt" value="${e(inputDateTime(activity?.endAt))}" /></label></div></section><details class="event-edit-group"><summary>盲盒資料（可修正）</summary><div class="inline-fields section"><label>卡牌名稱<input name="cardTitle" value="${e(cardData.canonicalName ?? cardData.title ?? "")}" placeholder="尚未讀取卡牌時可留空" /></label><label>稀有度<select name="cardRarity">${["N","R","SR","SSR","UR"].map(rarity => `<option ${rarity === (cardData.rarity ?? event.rarity) ? "selected" : ""}>${rarity}</option>`).join("")}</select></label><label>Wikidata QID（可選）<input name="wikidataQid" value="${e(cardData.wikidataQid ?? "")}" placeholder="例如 Q43184" /></label><label>來源網址（可選）<input type="url" name="sourceUrl" value="${e(cardData.sourceUrl ?? "")}" placeholder="https://…" /></label><label>來源名稱（可選）<input name="sourceTitle" value="${e(cardData.sourceTitle ?? "")}" /></label></div><label class="section">卡牌／進化介紹<textarea name="introduction" class="input">${e(cardData.introduction ?? "")}</textarea></label></details><details class="event-edit-group"><summary>原始智譜完整回覆（可修正）</summary><label class="section">完整貼入文字<textarea name="rawAiResult" class="input natural-input">${e(report?.rawAiResult ?? "")}</textarea></label></details><button class="button secondary" type="submit">儲存所有修正</button><p class="micro">事件 ID：<code>${e(event.id)}</code>（固定不變）</p></form><section class="event-delete-zone"><strong>不需要這筆紀錄？</strong><p class="micro">刪除後會移除這個事件及只屬於它的行動、回覆、候選卡與背包／進化資料，無法復原。若卡牌已被其他回響或進化使用，網站會先保護那些紀錄。</p><button class="button danger small" type="button" data-delete-event="${e(event.id)}">刪除這個事件</button></section></details>`;
}

function renderView() {
  const sections = { catalog: ["圖鑑", renderCatalog], journal: ["行動", renderJournal], insights: ["統計", renderInsights], settings: ["備份", renderSettings], guide: ["說明", renderGuide] };
  const [label, renderSection] = sections[viewSection] ?? sections.catalog;

</label><button id="reset-ledger" class="button danger">清除這台裝置的本機資料</button><div class="local-notice"><strong>重要：</strong>清除瀏覽器網站資料或使用無痕模式可能令本機紀錄消失。請定期下載 JSON 備份；GitHub 只保存網站程式，不保存你的個人紀錄。</div></div></section></div>`; }

  <section class="section help-steps"><article class="help-step"><h3>直接開始，不必申請 ID</h3><p>第一次開啟，網站會自動產生本機帳本 ID；這不是帳號，資料只留在此瀏覽器。</p></article><article class="help-step"><h3>方式 A：先在網站記錄</h3><p>寫下剛完成的事、選填時間與標籤，網站會產生事件 ID 和稀有度。複製短提示到 AI，將其自然語言結果貼回，網站會讀取候選卡並讓你確認。</p></article><article class="help-step"><h3>方式 B：沿用你原本的智譜習慣</h3><p>直接照平常方式和智譜對話。完成後只需把智譜整段回覆貼進「貼入智譜回覆，其他交給網站」；不必重寫原句、不必填標籤或 ID。網站會在本機推斷行動、建立外部補錄事件，並清楚標示該稀有度是 AI 聲稱而非網站預先鎖定。</p></article><article class="help-step"><h3>同一張卡是回響，不是失敗</h3><p>如果新貼入的物件已在圖鑑，網站會自動偵測回響、建立進化請求 ID 和補充提示。把這段提示貼回原本 AI 對話，再貼入進化回覆；網站會消耗兩張基礎卡並保存進化履歷。</p></article><article class="help-step"><h3>不同人可有不同生活重點</h3><p>在「設定與備份」選擇工作、健康、關係、興趣等重點及語氣，複製個人化提示詞。分類只作回顧用途，所有正向行動都會被誇獎。</p></article><article class="help-step"><h3>換裝置時手動搬遷</h3><p>舊裝置下載完整 JSON，新裝置選擇匯入。檔案會先驗證版本和雜湊，可選擇合併或完全取代。</p></article></section>`; }

  document.querySelector("[data-accept-possible-echo]")?.addEventListener("click", () => { const event = activeEvent(); if (!event) return; save(acceptPossibleEcho(ledger, event.id)); toast("已視為同一物件；下一步是建立進化請求。 "); });
  document.querySelector("[data-treat-new]")?.addEventListener("click", () => { const event = activeEvent(); if (!event) return; const updated = { ...event, status:"candidate_ready", resolvedMode:"external", echoCardId:null, echoDetection:"user_declared_distinct" }; save({ ...ledger, events:ledger.events.map(row => row.id === event.id ? updated : row) }); toast("已標示為不同物件，下一步是加入新圖鑑卡。 "); });
  document.querySelector("[data-start-evolution]")?.addEventListener("click", () => { const event = activeEvent(); if (!event) return; try { const result = prepareEvolution(ledger, event.id); save(result.ledger); toast(`已建立進化請求 ${result.request.id}。把提示貼給智譜即可。`); } catch (error) { toast(error.message ?? "無法建立進化請求。 "); } });
  document.querySelector("[data-open-ai-evolution]")?.addEventListener("click", () => { const options = document.querySelector("#ai-evolution-options"); if (!options) return; options.open = true; requestAnimationFrame(() => document.querySelector("#evolution-result-form textarea")?.focus()); });
  document.querySelector("[data-copy-evolution]")?.addEventListener("click", () => { const event = activeEvent(); const card = ledger.cards.find(row => row.id === event?.echoCardId); if (event && card) copy(evolutionPrompt(event, card)); });
  document.querySelector("[data-finish-local-evolution]")?.addEventListener("click", event => { const active = activeEvent(); const card = ledger.cards.find(row => row.id === active?.echoCardId); if (!active || !card) return; try { const result = finaliseEvolution(ledger, active.id, localEvolutionReply(active, card)); save(result.ledger); toast(`已完成本機進化：${result.fusion?.title ?? result.event.outcome?.title}`); } catch { toast("目前無法完成本機進化，請重新開啟這個回響事件。 "); } });
  document.querySelector("#evolution-result-form")?.addEventListener("submit", event => { event.preventDefault(); const data = new FormData(event.currentTarget); try { const result = finaliseEvolution(ledger, event.currentTarget.dataset.eventId, data.get("rawEvolution")); save(result.ledger); toast(result.fusion ? `進化完成：${result.fusion.title}` : "已加入第一張回響卡；下一張回響會觸發進化。 "); } catch { toast("找不到「恭喜進化為：【名稱】」；請貼入完整的智譜進化回覆。 "); } });
  document.querySelector("#ai-result-form")?.addEventListener("submit", event => { event.preventDefault(); const form = new FormData(event.currentTarget); const rawAiResult = String(form.get("rawResult") ?? ""); const original = ledger.events.find(row => row.id === event.currentTarget.dataset.eventId); const extraction = extractNaturalLanguageCard(rawAiResult); if (!original || !extraction.title || !extraction.rarity) return toast("找不到卡名或稀有度，請貼入完整 AI 回覆。 "); if (extraction.rarity !== original.rarity) return toast(`AI 說 ${extraction.rarity} 級，但本機事件已鎖定 ${original.rarity} 級；請把提示再貼給 AI，不會重擲骰。`); const result = candidateForEvent(ledger, original.id, { canonicalName:extraction.title, introduction:extraction.introduction, rawAiResult }); save(result.ledger); focusNextAction(); toast(result.duplicate ? "這張已存在；請使用重選提示。" : "已讀取候選卡，請補充來源或直接確認。 "); });
  document.querySelector("#candidate-form")?.addEventListener("submit", event => { event.preventDefault(); const form = new FormData(event.currentTarget); const id = event.currentTarget.dataset.eventId; try { const candidateResult = candidateForEvent(ledger, id, { canonicalName:form.get("title"), wikidataQid:form.get("wikidataQid"), sourceUrl:form.get("sourceUrl"), sourceTitle:form.get("sourceTitle"), introduction:ledger.events.find(row => row.id === id)?.candidate?.introduction }); if (candidateResult.duplicate) { save(candidateResult.ledger); return toast("此主體已存在，請重選。 "); } const final = confirmCandidate(candidateResult.ledger, id); save(final.ledger); toast(`已把「${final.card.canonicalName}」加入本機圖鑑。`); } catch (error) { toast(error.message ?? "無法確認此候選。 "); } });
  document.querySelector("#manual-activity-add")?.addEventListener("click", () => { const text = document.querySelector("#manual-activity-text").value; if (!text.trim()) return toast("請先寫下行動。 "); const result = addReportAndDraw(ledger, { text, tags:tagsOf(document.querySelector("#manual-activity-tags").value), startAt:document.querySelector("#manual-activity-start").value || null, endAt:document.querySelector("#manual-activity-end").value || null }); activeEventId = result.event.id; page = "home"; save(result.ledger); toast("已記錄行動並建立盲盒事件。 "); });
  document.querySelectorAll(".activity-category").forEach(select => select.addEventListener("change", () => { save(updateActivityCategory(ledger, select.dataset.activityId, select.value)); toast("已更新分類；行動清單標題已同步為新分類。 "); }));
  document.querySelectorAll("[data-period]").forEach(button => button.addEventListener("click", () => { insightPeriod = button.dataset.period; render(); }));
  document.querySelector("#catalog-query")?.addEventListener("input", event => { const text = event.target.value.toLowerCase(); const rarity = document.querySelector("#catalog-rarity").value; document.querySelector("#catalog-results").innerHTML = renderCatalogRows(ledger.cards.filter(card => (!rarity || card.rarity === rarity) && `${card.canonicalName} ${card.stableKey} ${card.sourceTitle ?? ""}`.toLowerCase().includes(text))); });
  document.querySelector("#catalog-rarity")?.addEventListener("change", () => document.querySelector("#catalog-query").dispatchEvent(new Event("input")));
  document.querySelector("#profile-form")?.addEventListener("submit", event => { event.preventDefault(); const data = new FormData(event.currentTarget); const profile = { displayName:String(data.get("displayName") ?? "").trim(), priorities:data.getAll("priorities"), encouragementTone:String(data.get("encouragementTone")), customDirections:String(data.get("customDirections") ?? "").trim(), onboardingDone:true }; save({ ...ledger, settings:{ ...ledger.settings, echoRate:Number(data.get("echoRate")), profile } }); toast("個人提示詞與抽取比例已保存在本機。 "); });
  document.querySelector("#profile-form [name=echoRate]")?.addEventListener("input", event => { document.querySelector("#echo-output").textContent = `${event.target.value}%`; });
  document.querySelector("#copy-profile-prompt")?.addEventListener("click", () => copy(buildPersonalPrompt(ledger)));
  document.querySelector("#export-json")?.addEventListener("click", async () => download("blackbox-memory-ledger-backup.json", await exportBackup(ledger), "application/json"));
  document.querySelector("#export-csv")?.addEventListener("click", () => download("blackbox-activity-log.csv", toCsv(), "text/csv;charset=utf-8"));
  document.querySelector("#import-file")?.addEventListener("change", async event => { const file = event.target.files?.[0]; if (!file) return; try { const incoming = await validateBackup(await file.text()); const replace = window.confirm("按「確定」完全取代這台裝置的本機帳本；按「取消」安全合併。\n\n完全取代前，建議先下載目前備份。"); if (!replace) { const conflicts = findMergeConflicts(ledger, incoming); if (conflicts.length) { const sample = conflicts.slice(0, 3).map(conflict => `${conflict.collection}：${conflict.identifier}`).join("；"); toast(`已停止合併，未寫入資料：發現 ${conflicts.length} 項衝突（${sample}${conflicts.length > 3 ? "等" : ""}）。請檢查備份，或確認後改選完整還原。`); event.target.value = ""; return; } } const next = replace ? incoming : mergeLedgers(ledger, incoming); save(next); toast(replace ? "已完全還原備份。" : "已合併備份資料。 "); } catch (error) { toast(error.message === "BACKUP_CHECKSUM_INVALID" ? "備份雜湊不符，未匯入任何資料。" : error.message === "BACKUP_MERGE_CONFLICT" ? "已停止合併：偵測到資料衝突，未寫入任何資料。" : "檔案格式或版本不正確，未匯入任何資料。 "); } });
  document.querySelector("#reset-ledger")?.addEventListener("click", () => { if (window.confirm("確定要清除這台裝置的所有本機資料嗎？此動作無法復原，除非你已有 JSON 備份。")) { localStorage.removeItem(STORAGE_KEY); ledger = safeParseLedger(null); activeEventId = null; render(); toast("這台裝置的本機帳本已清除。 "); } });
}

function toCsv() { const header = ["activity_id","event_id","action","category","tags","created_at","start_at","end_at","duration_minutes"]; const quote = value => `"${String(value ?? "").replaceAll('"','""')}"`; return "\ufeff" + [header, ...ledger.activities.map(row => [row.id,row.eventId,row.label,CATEGORY_META[row.category]?.label ?? "其他",row.tags.join("|"),row.createdAt,row.startAt,row.endAt,row.durationMinutes])].map(row => row.map(quote).join(",")).join("\n"); }
function download(filename, contents, type) { const url = URL.createObjectURL(new Blob([contents], { type })); const link = document.createElement("a"); link.href = url; link.download = filename; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
navButtons.forEach(button => button.addEventListener("click", () => { page = button.dataset.page; render(); app.focus(); }));
render();

</script>
  </body>
</html>
